<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOGRUB Bitácora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260801-1745" />
  <link rel="stylesheet" href="css/mobile.css?v=20260801-1745" />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="app-header">
    <div class="header-brand">
      <svg class="brand-logo" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 38 L4 18 L17 9 L17 29 Z" fill="#1a9fd4"/>
        <path d="M20 38 L20 18 L33 9 L33 29 Z" fill="#1a9fd4" opacity="0.65"/>
        <line x1="4" y1="9" x2="33" y2="9" stroke="#1a9fd4" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">SOGRUB</span>
        <span class="brand-sub">Bitácora Financiera</span>
      </div>
    </div>

    <nav class="main-nav" role="navigation" aria-label="Navegación principal">
      <button class="nav-tab active" data-view="dashboard">Dashboard</button>
      <button class="nav-tab" data-view="caja">Caja SOGRUB</button>
      <button class="nav-tab" data-view="efectivo">Efectivo</button>
      <button class="nav-tab" data-view="proyectos">Proyectos</button>
      <button class="nav-tab" data-view="proveedores">Proveedores</button>
      <button class="nav-tab" data-view="importar">Importar</button>
      <button class="nav-tab" data-view="analisis">Análisis</button>
      <button class="nav-tab" data-view="fiscal">Fiscal</button>
      <button class="nav-tab" data-view="buzon" style="position:relative">
        Buzón
        <span id="buzon-badge" style="display:none;background:#e15555;color:white;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:600;margin-left:4px;vertical-align:middle">0</span>
      </button>
    </nav>

    <!-- Indicador de conexión Firebase + configuración -->
    <div style="display:flex;align-items:center;gap:8px">
      <button id="btn-settings" title="Configuración"
        style="background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--text-muted);font-size:14px;line-height:1;transition:all var(--transition);display:flex;align-items:center"
        onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
        onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'">
        &#9881;
      </button>
      <button id="btn-hard-refresh" title="Recargar app" onclick="location.reload(true)"
        style="background:none;border:1px solid var(--border);border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--text-muted);font-size:12px;line-height:1;transition:all var(--transition);display:flex;align-items:center;gap:5px"
        onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
        onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'">
        &#x21BB;
      </button>
      <div id="db-status" class="db-status db-status--connecting" title="Estado de conexión con Firebase">
        <span class="db-status__dot"></span>
        <span class="db-status__label">Conectando…</span>
      </div>
    </div>
  </header>

  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="app-login" class="app-loading" style="display:none">
    <div class="app-loading__inner" style="max-width:360px;width:90%">
      <svg viewBox="0 0 44 44" fill="none" width="48" height="48">
        <path d="M4 38 L4 18 L17 9 L17 29 Z" fill="#1a9fd4"/>
        <path d="M20 38 L20 18 L33 9 L33 29 Z" fill="#1a9fd4" opacity="0.65"/>
      </svg>
      <span class="app-loading__name">SOGRUB</span>
      <span class="app-loading__msg">Acceso para administradores</span>
      <form id="login-form" style="display:flex;flex-direction:column;gap:10px;width:100%;margin-top:18px">
        <input type="email" id="login-email" placeholder="correo@empresa.com" required autocomplete="email"
               style="padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px"/>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password"
               style="padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px"/>
        <button type="submit" id="login-submit"
                style="padding:10px;background:var(--accent);color:#08121a;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px">
          Entrar
        </button>
        <div id="login-error" style="color:#e15555;font-size:13px;min-height:18px;text-align:center"></div>
      </form>
    </div>
  </div>

  <!-- ===================== LOADING SCREEN ===================== -->
  <div id="app-loading" class="app-loading">
    <div class="app-loading__inner">
      <svg viewBox="0 0 44 44" fill="none" width="48" height="48">
        <path d="M4 38 L4 18 L17 9 L17 29 Z" fill="#1a9fd4"/>
        <path d="M20 38 L20 18 L33 9 L33 29 Z" fill="#1a9fd4" opacity="0.65"/>
      </svg>
      <span class="app-loading__name">SOGRUB</span>
      <span class="app-loading__msg" id="loading-msg">Conectando con Firebase…</span>
      <div class="app-loading__spinner"></div>
    </div>
  </div>

  <!-- ===================== MAIN ===================== -->
  <main class="app-main" id="app-main" style="display:none">

    <section id="view-dashboard" class="view active"><div id="dashboard-root"></div></section>
    <section id="view-caja"      class="view"><div id="caja-root"></div></section>
    <section id="view-efectivo"  class="view"><div id="efectivo-root"></div></section>
    <section id="view-proyectos" class="view"><div id="proyectos-root"></div></section>
    <section id="view-detalle"      class="view"><div id="detalle-root"></div></section>
    <section id="view-proveedores" class="view"><div id="proveedores-root"></div></section>
    <section id="view-importar"    class="view"><div id="importar-root"></div></section>
    <section id="view-analisis"    class="view"><div id="analisis-root"></div></section>
    <section id="view-fiscal"      class="view"><div id="fiscal-root"></div></section>
    <section id="view-buzon"       class="view"><div id="buzon-root"></div></section>

  </main>

  <!-- ===================== MODAL ===================== -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card" id="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Cerrar modal">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- ===================== TOASTS ===================== -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- ===================== FIREBASE SDK (CDN compat) ===================== -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- PDF.js para OCR de facturas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- jsPDF para generar estados de cuenta -->
  <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>

  <!-- Chart.js para gráficas del módulo fiscal -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- SheetJS para exportación Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- JSZip para descargar facturas en ZIP -->
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- Google Identity Services para Drive -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- ===================== APP SCRIPTS =====================
       Cache-busting: el suffix ?v=... se debe bumpear en CADA deploy
       que toque cualquier .js local. Find-replace todas las ocurrencias
       de la versión actual al pushear (ver CLAUDE.md). -->
  <script src="js/drive.js?v=20260801-1745"></script>
  <script src="js/firebase.js?v=20260801-1745"></script>
  <script src="js/ocr.js?v=20260801-1745"></script>
  <script src="js/storage.js?v=20260801-1745"></script>
  <script src="js/calculations.js?v=20260801-1745"></script>
  <script src="js/components.js?v=20260801-1745"></script>
  <script src="js/views/dashboard.js?v=20260801-1745"></script>
  <script src="js/views/caja.js?v=20260801-1745"></script>
  <script src="js/views/efectivo.js?v=20260801-1745"></script>
  <script src="js/views/proyectos.js?v=20260801-1745"></script>
  <script src="js/views/detalle.js?v=20260801-1745"></script>
  <script src="js/views/presupuesto.js?v=20260801-1745"></script>
  <script src="js/views/proveedores.js?v=20260801-1745"></script>
  <script src="js/views/importar.js?v=20260801-1745"></script>
  <script src="js/views/analisis.js?v=20260801-1745"></script>
  <script src="js/fiscal-calculations.js?v=20260801-1745"></script>
  <script src="js/fiscal-xml-parser.js?v=20260801-1745"></script>
  <script src="js/views/fiscal.js?v=20260801-1745"></script>
  <script src="js/fiscal-export.js?v=20260801-1745"></script>
  <script src="js/views/buzon.js?v=20260801-1745"></script>
  <script src="js/views/caja-chica.js?v=20260801-1745"></script>
  <script src="js/settings.js?v=20260801-1745"></script>
  <script src="js/sync-finanzas.js?v=20260801-1745"></script>
  <script src="js/app.js?v=20260801-1745"></script>

</body>
</html>
