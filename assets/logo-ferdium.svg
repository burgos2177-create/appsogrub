<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f5ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle radial highlight -->
  <circle cx="150" cy="130" r="220" fill="#ffffff" opacity="0.06"/>

  <!-- ledger book -->
  <g filter="url(#shadow)">
    <!-- back cover -->
    <rect x="118" y="120" width="276" height="288" rx="20" fill="#0b3d2e"/>
    <!-- page -->
    <rect x="138" y="104" width="256" height="288" rx="18" fill="url(#page)"/>
    <!-- spine binding -->
    <rect x="138" y="104" width="22" height="288" rx="11" fill="#10b981"/>
  </g>

  <!-- ledger ruled lines -->
  <g stroke="#bfe8d6" stroke-width="8" stroke-linecap="round">
    <line x1="190" y1="168" x2="356" y2="168"/>
    <line x1="190" y1="210" x2="356" y2="210"/>
    <line x1="190" y1="252" x2="300" y2="252"/>
  </g>

  <!-- peso coin -->
  <g>
    <circle cx="316" cy="318" r="78" fill="#f59e0b"/>
    <circle cx="316" cy="318" r="78" fill="none" stroke="#b45309" stroke-width="8"/>
    <text x="316" y="352" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" fill="#7c3a06" text-anchor="middle">$</text>
  </g>
</svg>
